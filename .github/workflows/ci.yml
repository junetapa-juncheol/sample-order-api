name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bakery
          POSTGRES_DB: bakery
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bakery -d bakery" --health-interval 3s --health-timeout 3s --health-retries 20
      mongo:
        image: mongo:8
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=0
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://bakery@127.0.0.1:5432/bakery
      MONGO_URL: mongodb://127.0.0.1:27017
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
